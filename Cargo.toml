[package]
name = "ray-tracer"
version = "0.1.0"
authors = ["Ray Tran <ray@artran.co.uk>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ray-math = { path = "crates/math" }
ray-derive = { path = "crates/derive" }
ray-traits = { path = "crates/traits" }

[dev-dependencies]
rstest = "0.26.1"
spectral = "^0.6.0"

[workspace]
members = ["crates/math", "crates/derive", "crates/traits"]

[lints.clippy]
# pedantic - deny all
pedantic = { level = "deny", priority = -1 }

missing_const_for_fn = "deny"

# restrictions - denied
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
default_union_representation = "deny"
expect_used = "deny"
float_cmp_const = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
large_include_file = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
panic = "deny"
precedence_bits = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
renamed_function_params = "deny"
string_add = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# restrictions - warnings
# arithmetic_side_effects = "warn"
# doc_include_without_cfg = "warn"
# doc_paragraphs_missing_punctuation = "warn"
# error_impl_error = "warn"
# field_scoped_visibility_modifiers = "warn"
# filetype_is_file = "warn"
# missing_assert_message = "warn"
# non_zero_suggestions = "warn"
# partial_pub_fields = "warn"
# redundant_test_prefix = "warn"
# redundant_type_annotations = "warn"
# same_name_method = "warn"
# shadow_reuse = "warn"
# shadow_same = "warn"
# shadow_unrelated = "warn"
# str_to_string = "warn"
# suspicious_xor_used_as_pow = "warn"
# todo = "warn"
# unimplemented = "warn"
# unnecessary_safety_comment = "warn"
# unnecessary_safety_doc = "warn"
# unreachable = "warn"
# unseparated_literal_suffix = "warn"
# unused_trait_names = "warn"
# use_debug = "warn"
# verbose_file_reads = "warn"
